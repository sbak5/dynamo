worker_processes 4;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 18080;
        server_name _;
        root /models;
        autoindex off;
    }
}
